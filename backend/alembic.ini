[alembic]
script_location = %(here)s/alembic
# Revision files are named <revision>_<slug>.py, e.g. 0004_add_something.py.
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = %(here)s
path_separator = os
# sqlalchemy.url is deliberately not set here: alembic/env.py uses the URL a caller sets on the
# Config (the tests do) and otherwise DATABASE_URL, read through app.config.Settings.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
