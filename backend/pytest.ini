[pytest]
testpaths = tests
pythonpath = .
# The test directories are not packages, so with the default import mode two test modules that
# share a file name in different directories (tests/unit/test_x.py, tests/api/test_x.py) collide.
addopts = --import-mode=importlib
timeout = 120
markers =
    slow: takes several seconds; deselect with -m "not slow"
    concurrency: runs real threads against PostgreSQL to demonstrate behaviour under a race
