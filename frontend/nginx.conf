# Installed as /etc/nginx/conf.d/default.conf, so this file lives inside nginx's `http` context.

# One request id for nginx and the API: keep the caller's if there is one, otherwise use nginx's own.
map $http_x_request_id $request_id_for_api {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/problem+json image/svg+xml;

    # The API, on the same origin as the SPA (so no CORS). `^~` keeps the static-file rules below from
    # ever claiming an /api/ path. The upstream is resolved when a request arrives, through Docker's
    # embedded DNS, instead of once at start-up: a recreated `api` container gets a new address, and
    # nginx must not keep proxying to the old one. Without a URI in proxy_pass the request goes
    # upstream unchanged, path and query string included.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-ID $request_id_for_api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html names the current hashed bundles, so it must be revalidated on every load; this also
    # covers the try_files fallback below, which ends up here.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Bundles carry a content hash in their name and never change. A missing one is a 404, not the
    # index page: serving HTML where a script is expected only produces a confusing syntax error.
    location ~* \.(?:js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Anything else is a route of the single-page app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
